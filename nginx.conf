# ==============================================================================
# پیکربندی بهینه‌شده Nginx Reverse Proxy برای جلوگیری از خطای 502 Bad Gateway
# سازگار با Cloudflare، وب‌سوکت، کش فایل‌های استاتیک و هدرهای امنیتی
# ==============================================================================

# کش محلی در حافظه Nginx برای فایل‌های استاتیک (حفظ پایداری حتی در زمان ریستارت کانتینر Node)
proxy_cache_path /var/cache/nginx/static_cache levels=1:2 keys_zone=STATIC_CACHE:20m max_size=250m inactive=7d use_temp_path=off;

# مدیریت استاندارد هدر Upgrade برای WebSocket و Keep-Alive
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# تشخیص پروتکل واقعی کاربر (در صورت قرارگیری پشت Cloudflare یا SSL بیرونی)
map $http_x_forwarded_proto $real_scheme {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    # گوش دادن همزمان روی پورت 3000 و 80 داخل کانتینر برای سازگاری کامل با هر نوع تنظیم پورت روی VPS
    listen 3000 default_server;
    listen [::]:3000 default_server;
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name a.rangoresin.com _;

    # مخفی‌سازی نسخه Nginx برای امنیت بیشتر
    server_tokens off;

    # DNS داخلی داکر برای جلوگیری از کش شدن IP قدیمی کانتینر app پس از ریستارت (عامل اصلی 502 در داکر)
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # حداکثر حجم مجاز آپلود (مناسب برای بازیابی دیتابیس، اکسل، لوگو و ویس تلگرام)
    client_max_body_size 50M;
    client_body_buffer_size 1M;
    client_header_buffer_size 16k;
    large_client_header_buffers 4 64k;

    # تنظیمات Keep-Alive
    keepalive_timeout 60s;
    keepalive_requests 1000;
    send_timeout 60s;

    # ==========================================================================
    # ۱. فشرده‌سازی Gzip برای افزایش سرعت بارگذاری صفحات و گزارشات سنگین
    # ==========================================================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_buffers 16 8k;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/rss+xml
        font/ttf
        font/otf
        font/woff
        font/woff2
        image/svg+xml;

    # ==========================================================================
    # ۲. هدرهای امنیتی استاندارد (Security Headers)
    # ==========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # اجازه دسترسی میکروفون به خود دامنه جهت ثبت صوتی انبار و مسدودسازی سایر دسترسی‌های غیرضروری
    add_header Permissions-Policy "camera=(), geolocation=(), payment=(), microphone=(self)" always;

    # ==========================================================================
    # ۳. تنظیمات بافر و تایم‌اوت پروکسی (جلوگیری از 502 بر اثر پاسخ‌های بزرگ یا پردازش‌های سنگین)
    # ==========================================================================
    proxy_http_version 1.1;
    proxy_connect_timeout 60s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    # افزایش سایز بافرها برای جلوگیری از خطای "upstream sent too big header" (عامل رایج 502)
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 512k;
    proxy_temp_file_write_size 512k;

    # هدرهای ارسالی به سرور Express
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $real_scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # مدیریت هوشمند خطاهای موقت سرور بک‌اند
    proxy_intercept_errors on;
    error_page 502 503 504 = @backend_warming_up;

    # ==========================================================================
    # ۴. بررسی سلامت سریع Nginx و بک‌اند (Healthcheck)
    # ==========================================================================
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # ==========================================================================
    # ۵. مسیرهای API (بدون کش، با تایم‌اوت بالا برای دیتابیس، تلگرام و هوش مصنوعی)
    # ==========================================================================
    location /api/ {
        set $backend_upstream http://app:3000;
        proxy_pass $backend_upstream;

        # عدم کش شدن درخواست‌های API برای تضمین لحظه‌ای بودن اطلاعات مالی و انبار
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires off;

        # در درخواست‌های API، پیغام خطای JSON خود سرور (در صورت وجود) دست‌نخورده ارسال شود
        proxy_intercept_errors off;
    }

    # ==========================================================================
    # ۶. فایل‌های استاتیک بیلد شده (JS, CSS, Fonts, Images) با کش سطح بالا
    # ==========================================================================
    location ~* ^/assets/.*\.(?:css|js|mjs|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|ico|webp|avif)$ {
        set $backend_upstream http://app:3000;
        proxy_pass $backend_upstream;

        # فعال‌سازی کش در لایه Nginx + مرورگر
        proxy_cache STATIC_CACHE;
        proxy_cache_valid 200 302 365d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;

        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # سایر فایل‌های استاتیک ریشه (favicon, manifest, فونت‌ها و تصاویر عمومی)
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        set $backend_upstream http://app:3000;
        proxy_pass $backend_upstream;

        proxy_cache STATIC_CACHE;
        proxy_cache_valid 200 302 7d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        expires 7d;
        access_log off;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ==========================================================================
    # ۷. روت اصلی برنامه (SPA React Application)
    # ==========================================================================
    location / {
        set $backend_upstream http://app:3000;
        proxy_pass $backend_upstream;

        # صفحه index.html نباید کش شود تا آپدیت‌های جدید برنامه بلافاصله بارگذاری شوند
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ==========================================================================
    # ۸. صفحه هوشمند انتظار در زمان ریستارت یا آپدیت کانتینر (جایگزین خطای 502 Cloudflare)
    # ==========================================================================
    location @backend_warming_up {
        default_type text/html;
        charset utf-8;
        add_header Retry-After 3 always;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        return 503 '<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="3">
  <title>در حال اتصال به سرور...</title>
  <style>
    body { font-family: Tahoma, system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 32px 24px; max-width: 420px; width: 90%; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.4); }
    .spinner { width: 44px; height: 44px; border: 4px solid #334155; border-top-color: #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    h1 { font-size: 18px; margin: 0 0 10px; color: #f1f5f9; }
    p { font-size: 13px; color: #94a3b8; line-height: 1.8; margin: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h1>سامانه در حال آماده‌سازی است...</h1>
    <p>سرویس در حال راه‌اندازی یا اعمال به‌روزرسانی است. این صفحه تا چند ثانیه دیگر به صورت خودکار بارگذاری می‌شود.</p>
  </div>
</body>
</html>';
    }
}
