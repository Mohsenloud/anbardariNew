<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.25" flood-color="#064e3b" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />

  <!-- Sheet Document -->
  <g filter="url(#shadow)">
    <rect x="110" y="80" width="292" height="352" rx="28" fill="#ffffff" />
    
    <!-- Top Header bar on sheet -->
    <rect x="135" y="115" width="100" height="20" rx="10" fill="#059669" />
    <rect x="295" y="115" width="80" height="20" rx="10" fill="#e2e8f0" />

    <!-- Divider Line -->
    <line x1="135" y1="160" x2="375" y2="160" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" stroke-dasharray="6 6" />

    <!-- Invoice Lines -->
    <rect x="135" y="185" width="150" height="14" rx="7" fill="#64748b" />
    <rect x="315" y="185" width="60" height="14" rx="7" fill="#94a3b8" />

    <rect x="135" y="215" width="120" height="14" rx="7" fill="#64748b" />
    <rect x="315" y="215" width="60" height="14" rx="7" fill="#94a3b8" />

    <rect x="135" y="245" width="160" height="14" rx="7" fill="#64748b" />
    <rect x="315" y="245" width="60" height="14" rx="7" fill="#94a3b8" />

    <!-- Total Area -->
    <rect x="135" y="285" width="240" height="42" rx="12" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2" />
    <rect x="150" y="300" width="80" height="12" rx="6" fill="#059669" />
    <rect x="290" y="297" width="70" height="18" rx="6" fill="#047857" />

    <!-- Barcode strip at bottom of sheet -->
    <g transform="translate(145, 352)">
      <rect x="0" y="0" width="4" height="44" fill="#334155" />
      <rect x="8" y="0" width="8" height="44" fill="#334155" />
      <rect x="22" y="0" width="4" height="44" fill="#334155" />
      <rect x="32" y="0" width="12" height="44" fill="#334155" />
      <rect x="50" y="0" width="6" height="44" fill="#334155" />
      <rect x="62" y="0" width="4" height="44" fill="#334155" />
      <rect x="72" y="0" width="10" height="44" fill="#334155" />
      <rect x="88" y="0" width="4" height="44" fill="#334155" />
      <rect x="98" y="0" width="8" height="44" fill="#334155" />
      <rect x="112" y="0" width="6" height="44" fill="#334155" />
      <rect x="124" y="0" width="10" height="44" fill="#334155" />
      <rect x="140" y="0" width="4" height="44" fill="#334155" />
      <rect x="150" y="0" width="12" height="44" fill="#334155" />
      <rect x="168" y="0" width="6" height="44" fill="#334155" />
      <rect x="180" y="0" width="4" height="44" fill="#334155" />
      <rect x="190" y="0" width="10" height="44" fill="#334155" />
      <rect x="206" y="0" width="8" height="44" fill="#334155" />
      <rect x="218" y="0" width="4" height="44" fill="#334155" />
    </g>
  </g>

  <!-- Verified Badge -->
  <circle cx="395" cy="115" r="32" fill="#10b981" stroke="#ffffff" stroke-width="6" />
  <path d="M383 115 L391 123 L408 106" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
